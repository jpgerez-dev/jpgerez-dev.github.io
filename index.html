                          onChange={(e) => setContactForm({ ...contactForm, name: e.target.value })}
                          placeholder="Ej. María González"
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 text-slate-900 dark:text-white focus:outline-none focus:border-sky-500 text-xs sm:text-sm transition"
                        />
                      </div>

                      <div>
                        <label className="block text-[11px] font-bold uppercase text-slate-500 dark:text-slate-400 mb-1.5">
                          Tu Correo Electrónico *
                        </label>
                        <input
                          type="email"
                          required
                          value={contactForm.email}
                          onChange={(e) => setContactForm({ ...contactForm, email: e.target.value })}
                          placeholder="maria@empresa.com"
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 text-slate-900 dark:text-white focus:outline-none focus:border-sky-500 text-xs sm:text-sm transition"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold uppercase text-slate-500 dark:text-slate-400 mb-1.5">
                        Asunto
                      </label>
                      <input
                        type="text"
                        value={contactForm.subject}
                        onChange={(e) => setContactForm({ ...contactForm, subject: e.target.value })}
                        placeholder="Oportunidad laboral, pasantía, proyecto..."
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 text-slate-900 dark:text-white focus:outline-none focus:border-sky-500 text-xs sm:text-sm transition"
                      />
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold uppercase text-slate-500 dark:text-slate-400 mb-1.5">
                        Mensaje *
                      </label>
                      <textarea
                        rows="4"
                        required
                        value={contactForm.message}
                        onChange={(e) => setContactForm({ ...contactForm, message: e.target.value })}
                        placeholder="Escribe tu consulta o propuesta..."
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 text-slate-900 dark:text-white focus:outline-none focus:border-sky-500 text-xs sm:text-sm transition resize-none"
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      disabled={formStatus.submitting}
                      className="w-full py-3.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold shadow-lg shadow-sky-500/30 transition flex items-center justify-center gap-2 text-xs sm:text-sm"
                    >
                      {formStatus.submitting ? (
                        <>
                          <i className="fas fa-spinner animate-spin"></i>
                          <span>Enviando mensaje...</span>
                        </>
                      ) : (
                        <>
                          <i className="fas fa-paper-plane"></i>
                          <span>Enviar Mensaje</span>
                        </>
                      )}
                    </button>
                  </form>
                </div>

              </div>

            </div>
          </section>

          {/* FOOTER */}
          <footer className="border-t border-slate-200 dark:border-slate-900 py-10 glass-card">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="text-center sm:text-left">
                <p className="font-bold text-slate-900 dark:text-white text-sm">
                  © {new Date().getFullYear()} {portfolioData.personal.name}
                </p>
                <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                  Estudiante de Ingeniería en Sistemas de Información (UTN FRT)
                </p>
              </div>

              <div className="flex items-center gap-4 text-xs font-semibold text-slate-500">
                <a href="#inicio" className="hover:text-sky-500 transition">Volver arriba ↑</a>
              </div>
            </div>
          </footer>

          {/* PROJECT DETAIL MODAL */}
          {activeProjectModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
              <div className="glass-card max-w-2xl w-full max-h-[90vh] overflow-y-auto rounded-3xl border border-slate-200/80 dark:border-slate-800 p-6 sm:p-8 relative shadow-2xl">
                
                <button
                  onClick={() => setActiveProjectModal(null)}
                  className="absolute top-5 right-5 w-9 h-9 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 flex items-center justify-center hover:bg-red-500 hover:text-white transition text-sm"
                >
                  <i className="fas fa-xmark"></i>
                </button>

                <div className="space-y-5">
                  <div>
                    <span className="px-3 py-1 rounded-full bg-sky-100 dark:bg-sky-950 text-sky-700 dark:text-sky-300 text-[11px] font-bold uppercase tracking-wider">
                      {activeProjectModal.category}
                    </span>
                    <h2 className="text-2xl font-extrabold text-slate-900 dark:text-white mt-2">
                      {activeProjectModal.title}
                    </h2>
                    {activeProjectModal.subtitle && (
                      <p className="text-xs font-semibold text-sky-600 dark:text-sky-400">
                        {activeProjectModal.subtitle}
                      </p>
                    )}
                  </div>

                  <img
                    src={activeProjectModal.image}
                    alt={activeProjectModal.title}
                    className="w-full h-56 object-cover rounded-2xl shadow-md"
                  />

                  <div>
                    <h4 className="text-xs font-bold uppercase text-slate-400 mb-1.5">Descripción Detallada</h4>
                    <p className="text-slate-600 dark:text-slate-300 leading-relaxed text-xs sm:text-sm">
                      {activeProjectModal.fullDesc}
                    </p>
                  </div>

                  {activeProjectModal.challenges && (
                    <div className="p-4 rounded-2xl bg-sky-50 dark:bg-sky-950/40 border border-sky-200 dark:border-sky-900/50">
                      <h4 className="text-xs font-bold text-sky-800 dark:text-sky-300 mb-1">
                        <i className="fas fa-lightbulb mr-2"></i> Desafío & Implementación
                      </h4>
                      <p className="text-xs text-slate-700 dark:text-slate-300">
                        {activeProjectModal.challenges}
                      </p>
                    </div>
                  )}

                  <div>
                    <h4 className="text-xs font-bold uppercase text-slate-400 mb-2">Tecnologías Aplicadas</h4>
                    <div className="flex flex-wrap gap-1.5">
                      {activeProjectModal.technologies.map((t, i) => (
                        <span key={i} className="px-2.5 py-1 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200 text-xs font-semibold">
                          {t}
                        </span>
                      ))}
                    </div>
                  </div>

                  <div className="pt-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-end gap-3">
                    <a
                      href={portfolioData.personal.social.github}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="px-5 py-2.5 rounded-xl bg-sky-600 text-white font-bold text-xs shadow hover:bg-sky-700 transition flex items-center gap-2"
                    >
                      <i className="fab fa-github"></i> Ver en GitHub
                    </a>
                  </div>

                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
